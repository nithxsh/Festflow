<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <style>
      @keyframes cursorBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes pulseLight { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.4; } }
      @keyframes scanline { 0% { transform: translateY(0); } 100% { transform: translateY(420px); } }
      @keyframes flowDash { to { stroke-dashoffset: -40; } }
      .bg { fill: #0b1120; }
      .grid { stroke: rgba(148, 163, 184, 0.08); stroke-width: 1; }
      .border-line { stroke: #1e293b; stroke-width: 1.5; }
      .header-bg { fill: #0f172a; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-weight: 800; font-size: 38px; fill: #f8fafc; letter-spacing: -0.02em; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 15px; fill: #94a3b8; }
      .terminal-bg { fill: #090e17; stroke: #1e293b; stroke-width: 1.5; rx: 6px; }
      .code-line { font-family: "SF Mono", Monaco, Consolas, "Liberation Mono", monospace; font-size: 13.5px; fill: #cbd5e1; }
      .code-green { fill: #10b981; font-weight: 600; }
      .code-cyan { fill: #06b6d4; font-weight: 600; }
      .code-dim { fill: #64748b; }
      .badge-bg { fill: #131d2e; stroke: #1e293b; stroke-width: 1; rx: 4px; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 12px; font-weight: 600; fill: #38bdf8; }
      .cursor { animation: cursorBlink 1s infinite; fill: #10b981; }
      .active-dot { animation: pulseLight 2s infinite ease-in-out; }
      .flow-stream { stroke-dasharray: 6 6; animation: flowDash 2s linear infinite; }
    </style>
    <pattern id="cadGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" class="grid"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" class="bg" />
  <rect width="1200" height="420" fill="url(#cadGrid)" />

  <!-- Top Decorative Header Bar -->
  <rect x="30" y="24" width="1140" height="52" rx="6" class="header-bg" />
  <rect x="30" y="24" width="1140" height="52" rx="6" fill="none" class="border-line" />

  <!-- Status indicators -->
  <circle cx="56" cy="50" r="5" fill="#ef4444" />
  <circle cx="74" cy="50" r="5" fill="#f59e0b" />
  <circle cx="92" cy="50" r="5" fill="#10b981" />

  <text x="120" y="55" class="sub-text" font-weight="600" fill="#cbd5e1">FESTFLOW // ENGINE CORE</text>
  <text x="320" y="55" class="sub-text" fill="#64748b">ARCHITECTURE: EVENT-DRIVEN AUTOMATION</text>

  <!-- System Online Chip -->
  <rect x="1000" y="36" width="150" height="28" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1" />
  <circle cx="1016" cy="50" r="4" fill="#34d399" class="active-dot" />
  <text x="1028" y="55" font-family="monospace" font-size="12" font-weight="700" fill="#34d399">ENGINE ONLINE</text>

  <!-- Left Hero Block -->
  <text x="40" y="130" class="title-text">FESTFLOW</text>
  <text x="40" y="162" class="sub-text" font-size="18" fill="#e2e8f0">Production-Grade WhatsApp Event Registration &amp; Ticketing Engine</text>

  <!-- Tag Badges -->
  <g transform="translate(40, 185)">
    <rect width="128" height="26" class="badge-bg" />
    <text x="12" y="17" class="badge-text">24/7 WHATSAPP MD</text>

    <rect x="136" width="116" height="26" class="badge-bg" />
    <text x="148" y="17" class="badge-text">TESSERACT OCR</text>

    <rect x="260" width="138" height="26" class="badge-bg" />
    <text x="272" y="17" class="badge-text">SUPABASE ATOMIC</text>

    <rect x="406" width="144" height="26" class="badge-bg" />
    <text x="418" y="17" class="badge-text">HMAC SIGNED PASS</text>
  </g>

  <!-- Left Info Specs Grid -->
  <g transform="translate(40, 235)">
    <!-- Track A Card -->
    <rect width="250" height="85" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <rect x="14" y="14" width="75" height="20" rx="3" fill="#064e3b" />
    <text x="22" y="28" font-family="monospace" font-size="11" font-weight="700" fill="#34d399">TRACK A</text>
    <text x="14" y="52" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Host College OD Pass</text>
    <text x="14" y="70" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Zero-fee • Instant Mentor WhatsApp Alert</text>

    <!-- Track B Card -->
    <rect x="265" width="255" height="85" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <rect x="279" y="14" width="75" height="20" rx="3" fill="#083344" />
    <text x="287" y="28" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">TRACK B</text>
    <text x="279" y="52" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">External Delegate Spot</text>
    <text x="279" y="70" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Dynamic UPI QR • 1.2s OCR Verification</text>

    <!-- Stats Row -->
    <g transform="translate(0, 100)">
      <rect width="160" height="50" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="24" font-family="monospace" font-size="11" fill="#64748b">PROCESSING</text>
      <text x="14" y="42" font-family="monospace" font-size="16" font-weight="700" fill="#10b981">&lt; 1.5s / reg</text>

      <rect x="175" width="165" height="50" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="189" y="24" font-family="monospace" font-size="11" fill="#64748b">PREVENTION</text>
      <text x="189" y="42" font-family="monospace" font-size="16" font-weight="700" fill="#38bdf8">Atomic UTR Lock</text>

      <rect x="355" width="165" height="50" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="369" y="24" font-family="monospace" font-size="11" fill="#64748b">ADMISSION</text>
      <text x="369" y="42" font-family="monospace" font-size="16" font-weight="700" fill="#f59e0b">Offline PWA Scan</text>
    </g>
  </g>

  <!-- Right Side: Terminal Daemon Window -->
  <g transform="translate(600, 100)">
    <rect width="570" height="285" class="terminal-bg" />

    <!-- Terminal Bar -->
    <rect width="570" height="34" rx="6" fill="#131d2e" />
    <line x1="0" y1="34" x2="570" y2="34" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="20" cy="17" r="4.5" fill="#ef4444" />
    <circle cx="36" cy="17" r="4.5" fill="#f59e0b" />
    <circle cx="52" cy="17" r="4.5" fill="#10b981" />
    <text x="74" y="22" font-family="monospace" font-size="12" fill="#94a3b8">festflow-engine — bash (1080x1920 stream)</text>

    <!-- Code / Log content -->
    <g transform="translate(20, 60)">
      <text y="0" class="code-line"><tspan fill="#64748b">$</tspan> npx festflow boot --live</text>
      <text y="24" class="code-line code-dim">[BOOT] Initializing Baileys WhatsApp MD Socket...</text>
      <text y="48" class="code-line code-cyan">[AUTH] Loaded Multi-File Signal Auth State</text>
      <text y="72" class="code-line code-green">[ENGINE] Connected &amp; Online (24/7 Listener Active)</text>

      <line x1="0" y1="90" x2="530" y2="90" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />

      <text y="112" class="code-line"><tspan fill="#38bdf8">INBOUND:</tspan> 919876543210 &gt;&gt; "Hi"</text>
      <text y="134" class="code-line"><tspan fill="#10b981">DISPATCH:</tspan> Event track selection menu delivered</text>
      <text y="156" class="code-line"><tspan fill="#f59e0b">OCR VERIFY:</tspan> UTR 429184029184 &gt;&gt; <tspan class="code-green">VALIDATED [MATCH]</tspan></text>
      <text y="178" class="code-line"><tspan fill="#38bdf8">HMAC SIGN:</tspan> Token FF26-8A3F &gt;&gt; Pass rendered &amp; sent</text>
      <text y="200" class="code-line code-dim">Ready for incoming attendee registrations...</text>
      <rect x="365" y="190" width="8" height="13" class="cursor" />
    </g>
  </g>
</svg>
