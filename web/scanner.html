<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FestFlow // Gate Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #0284c7;
      --green: #16a34a;
      --red: #dc2626;
      --yellow: #d97706;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, monospace;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* CAD 24px Engineering Grid Background */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(to right, rgba(51, 65, 85, 0.25) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(51, 65, 85, 0.25) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 620px;
      margin: 0 auto;
      padding: 16px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-main);
    }

    .badge {
      font-size: 11px;
      font-family: monospace;
      padding: 3px 8px;
      background: #0284c7;
      color: #fff;
      border-radius: 2px;
    }

    /* Camera Viewfinder */
    .scanner-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #reader {
      width: 100%;
      min-height: 280px;
      background: #000;
    }

    #reader__scan_region {
      background: transparent !important;
    }

    .controls {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #1e293b;
      border-top: 1px solid var(--border);
    }

    button {
      flex: 1;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      border: 1px solid var(--border);
      background: #334155;
      color: var(--text-main);
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button:hover {
      background: #475569;
    }

    button.btn-primary {
      background: var(--accent);
      border-color: #0369a1;
    }

    button.btn-primary:hover {
      background: #0284c7;
    }

    /* Result Display */
    .result-box {
      border-radius: 6px;
      padding: 16px;
      display: none;
      border: 2px solid transparent;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-box.valid {
      display: block;
      background: rgba(22, 163, 74, 0.15);
      border-color: var(--green);
    }

    .result-box.invalid {
      display: block;
      background: rgba(220, 38, 38, 0.15);
      border-color: var(--red);
    }

    .result-status {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .valid .result-status { color: #4ade80; }
    .invalid .result-status { color: #f87171; }

    .result-detail {
      font-size: 12px;
      color: var(--text-main);
      line-height: 1.6;
      font-family: monospace;
    }

    .manual-box {
      display: flex;
      gap: 8px;
      background: var(--card-bg);
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Settings Panel */
    .settings-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px;
      font-size: 12px;
    }

    .settings-panel summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--text-muted);
    }

    .settings-form {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title">FESTFLOW // GATE ADMISSION SCANNER</div>
      <div class="badge" id="scan-count">SCANNED: 0</div>
    </header>

    <div class="scanner-card">
      <div id="reader"></div>
      <div class="controls">
        <button id="btn-start" class="btn-primary" onclick="startScanner()">ACTIVATE CAMERA</button>
        <button id="btn-stop" onclick="stopScanner()" style="display:none;">PAUSE SCANNER</button>
        <input type="file" id="qr-input-file" accept="image/*" style="display:none;" onchange="handleFileScan(this.files)">
        <button type="button" onclick="document.getElementById('qr-input-file').click()">SELECT PASS IMAGE</button>
      </div>
    </div>

    <!-- Live Scan Outcome Card -->
    <div id="result-card" class="result-box">
      <div class="result-status" id="res-status"></div>
      <div class="result-detail" id="res-detail"></div>
    </div>

    <!-- Manual Code Fallback Entry -->
    <div class="manual-box">
      <input type="text" id="manual-input" placeholder="Paste or type token (<roll>.<evt>.<ts>.<sig>)">
      <button onclick="handleManualVerify()" style="flex:0 0 100px;">VERIFY</button>
    </div>

    <!-- Security & Integration Settings Drawer -->
    <details class="settings-panel">
      <summary>Gate Security & Database Settings</summary>
      <div class="settings-form">
        <label>Pass Signing Secret (HMAC-SHA256):</label>
        <input type="text" id="cfg-secret" value="festflow_fallback_signing_secret_key_2025">
        
        <label>Supabase URL (Optional for instant live check-in):</label>
        <input type="text" id="cfg-supabase-url" placeholder="https://your-project.supabase.co">
        
        <label>Supabase Anon Key:</label>
        <input type="text" id="cfg-supabase-key" placeholder="eyJhbGci...">
        
        <button onclick="saveConfig()">SAVE CONFIGURATION</button>
      </div>
    </details>

    <div class="stat-row">
      <span>MODE: LOCAL HMAC + SUPABASE REST</span>
      <span>SECURITY: HMAC-SHA256</span>
    </div>
  </div>

  <script>
    let html5QrCode = null;
    let isScanning = false;
    let scanCount = 0;
    let lastScannedToken = "";
    let lastScanTime = 0;

    // Load saved settings
    document.addEventListener("DOMContentLoaded", () => {
      const savedSecret = localStorage.getItem("ff_secret");
      if (savedSecret) document.getElementById("cfg-secret").value = savedSecret;

      const savedUrl = localStorage.getItem("ff_sb_url");
      if (savedUrl) document.getElementById("cfg-supabase-url").value = savedUrl;

      const savedKey = localStorage.getItem("ff_sb_key");
      if (savedKey) document.getElementById("cfg-supabase-key").value = savedKey;
    });

    function saveConfig() {
      localStorage.setItem("ff_secret", document.getElementById("cfg-secret").value.trim());
      localStorage.setItem("ff_sb_url", document.getElementById("cfg-supabase-url").value.trim());
      localStorage.setItem("ff_sb_key", document.getElementById("cfg-supabase-key").value.trim());
      alert("Settings saved successfully.");
    }

    function playBeep(success) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(success ? 880 : 330, ctx.currentTime);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + (success ? 0.15 : 0.35));
      } catch (_) {}
    }

    async function computeHmacSignature(message, secret) {
      const enc = new TextEncoder();
      const key = await window.crypto.subtle.importKey(
        "raw",
        enc.encode(secret),
        { name: "HMAC", hash: "SHA-256" },
        false,
        ["sign"]
      );
      const signatureBuffer = await window.crypto.subtle.sign("HMAC", key, enc.encode(message));
      const hashArray = Array.from(new Uint8Array(signatureBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 16);
    }

    async function verifyToken(token) {
      const secret = document.getElementById("cfg-secret").value.trim() || "festflow_fallback_signing_secret_key_2025";
      
      const parts = token.trim().split(".");
      if (parts.length !== 4) {
        return { valid: false, error: "MALFORMED TOKEN // INVALID STRUCTURE" };
      }

      const [roll, eventId, ts, sig] = parts;
      const rawBody = `${roll}.${eventId}.${ts}`;
      const expectedSig = await computeHmacSignature(rawBody, secret);

      if (sig !== expectedSig) {
        return { valid: false, error: "TAMPERED PASS // SIGNATURE MISMATCH" };
      }

      return {
        valid: true,
        roll,
        eventId,
        timestamp: parseInt(ts, 10),
      };
    }

    async function processGateAdmission(rawToken) {
      // Debounce rapid re-scans of exact same ticket within 3 seconds
      const now = Date.now();
      if (rawToken === lastScannedToken && now - lastScanTime < 3000) return;
      lastScannedToken = rawToken;
      lastScanTime = now;

      const card = document.getElementById("result-card");
      const statusEl = document.getElementById("res-status");
      const detailEl = document.getElementById("res-detail");

      const auth = await verifyToken(rawToken);

      if (!auth.valid) {
        playBeep(false);
        card.className = "result-box invalid";
        statusEl.innerHTML = "⛔ GATE ADMISSION DENIED";
        detailEl.innerHTML = `REASON: ${auth.error}<br>RAW TOKEN: ${rawToken}`;
        return;
      }

      // Check online Supabase status if configured
      const sbUrl = document.getElementById("cfg-supabase-url").value.trim();
      const sbKey = document.getElementById("cfg-supabase-key").value.trim();

      if (sbUrl && sbKey) {
        try {
          const fetchRes = await fetch(`${sbUrl}/rest/v1/registrations?roll_number=eq.${encodeURIComponent(auth.roll)}&event_id=eq.${encodeURIComponent(auth.eventId)}&select=*`, {
            headers: {
              "apikey": sbKey,
              "Authorization": `Bearer ${sbKey}`,
            }
          });
          const records = await fetchRes.json();

          if (!records || records.length === 0) {
            playBeep(false);
            card.className = "result-box invalid";
            statusEl.innerHTML = "⚠️ NO DATABASE RECORD FOUND";
            detailEl.innerHTML = `Roll: ${auth.roll} • Event: ${auth.eventId}<br>The HMAC is authentic, but no student registration row exists in Supabase.`;
            return;
          }

          const student = records[0];

          // Check if already checked-in
          if (student.checked_in) {
            playBeep(false);
            card.className = "result-box invalid";
            statusEl.innerHTML = "⚠️ ALREADY CHECKED IN";
            const checkTime = student.updated_at ? new Date(student.updated_at).toLocaleTimeString() : "Earlier Today";
            detailEl.innerHTML = `
              <strong>ATTENDEE:</strong> ${student.full_name}<br>
              <strong>ROLL NO:</strong> ${student.roll_number}<br>
              <strong>CHECKED IN AT:</strong> ${checkTime}<br>
              <em>Pass has already been utilized for gate entry.</em>
            `;
            return;
          }

          // Check OD status
          if (student.od_status === "REJECTED") {
            playBeep(false);
            card.className = "result-box invalid";
            statusEl.innerHTML = "⛔ ENTRY REFUSED // OD REJECTED";
            detailEl.innerHTML = `
              <strong>ATTENDEE:</strong> ${student.full_name}<br>
              <strong>COLLEGE:</strong> ${student.college_name}<br>
              <strong>STATUS:</strong> OD request was explicitly rejected by faculty.
            `;
            return;
          }

          // Mark checked_in = true in Supabase
          await fetch(`${sbUrl}/rest/v1/registrations?id=eq.${student.id}`, {
            method: "PATCH",
            headers: {
              "apikey": sbKey,
              "Authorization": `Bearer ${sbKey}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ checked_in: true, updated_at: new Date().toISOString() })
          });

          // Success confirmation
          scanCount++;
          document.getElementById("scan-count").textContent = `SCANNED: ${scanCount}`;
          playBeep(true);

          card.className = "result-box valid";
          statusEl.innerHTML = "✅ VALID PASS // ADMISSION GRANTED";
          detailEl.innerHTML = `
            <strong>ATTENDEE:</strong> ${student.full_name}<br>
            <strong>ROLL NO:</strong> ${student.roll_number}<br>
            <strong>INSTITUTION:</strong> ${student.college_name}<br>
            <strong>EVENT:</strong> ${student.event_name}<br>
            <strong>OD STATUS:</strong> ${student.od_status}<br>
            <strong>TIMESTAMP:</strong> ${new Date().toLocaleTimeString()}
          `;
          return;
        } catch (dbErr) {
          console.warn("[SCANNER DB NOTE]", dbErr);
        }
      }

      // Offline HMAC fallback validation (when Supabase is unconfigured or offline)
      scanCount++;
      document.getElementById("scan-count").textContent = `SCANNED: ${scanCount}`;
      playBeep(true);

      card.className = "result-box valid";
      statusEl.innerHTML = "✅ VALID PASS (OFFLINE HMAC VERIFIED)";
      detailEl.innerHTML = `
        <strong>ROLL NO:</strong> ${auth.roll}<br>
        <strong>EVENT ID:</strong> ${auth.eventId}<br>
        <strong>PASS ISSUE TIME:</strong> ${new Date(auth.timestamp).toLocaleTimeString()}<br>
        <strong>GATE SCAN TIME:</strong> ${new Date().toLocaleTimeString()}<br>
        <em>HMAC signature verified against local secret key.</em>
      `;
    }

    function handleManualVerify() {
      const val = document.getElementById("manual-input").value.trim();
      if (!val) return;
      processGateAdmission(val);
    }

    async function handleFileScan(files) {
      if (!files || files.length === 0) return;
      const file = files[0];
      try {
        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("reader");
        }
        const decodedText = await html5QrCode.scanFile(file, true);
        processGateAdmission(decodedText);
      } catch (err) {
        alert("Could not detect a QR code in the selected pass image: " + (err.message || err));
      }
    }

    function startScanner() {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }
      const config = { fps: 15, qrbox: { width: 250, height: 250 } };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        (decodedText) => {
          processGateAdmission(decodedText);
        },
        () => {}
      ).then(() => {
        isScanning = true;
        document.getElementById("btn-start").style.display = "none";
        document.getElementById("btn-stop").style.display = "inline-block";
      }).catch((err) => {
        alert("Camera initialization error: " + err + "\n\nTip: Modern browsers require HTTPS or localhost for live camera access. If opening as file://, click 'SELECT PASS IMAGE' to verify ticket photos directly.");
      });
    }

    function stopScanner() {
      if (html5QrCode && isScanning) {
        html5QrCode.stop().then(() => {
          isScanning = false;
          document.getElementById("btn-start").style.display = "inline-block";
          document.getElementById("btn-stop").style.display = "none";
        });
      }
    }
  </script>
</body>
</html>
